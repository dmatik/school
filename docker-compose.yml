services:
  app:
    image: dmatik/school:local
    build:
      context: .
      args:
        APP_VERSION: "local"
    ports:
      - "8080:5173"
    environment:
      # Log level: "errors" (default; failures, failed app logins & lockouts) or "all" (app logins, mutations & Webtop calls)
      - LOG_LEVEL=${LOG_LEVEL:-errors}
    volumes:
      - ./data:/app/data
    restart: always
