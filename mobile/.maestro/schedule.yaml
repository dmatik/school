appId: com.school.app
---
# 1. Parent / Admin mobile schedule, edit mode FAB, exams FAB, and admin fullscreen modal
- launchApp:
    clearState: true
- tapOn:
    id: "server-url-input"
- inputText: "${SERVER_URL}"
- tapOn:
    id: "username-input"
- inputText: "${ADMIN_USERNAME}"
- tapOn:
    id: "password-input"
- inputText: "${ADMIN_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "login-submit-button"

# Navigate to Schedule
- tapOn:
    id: "dock-tab-schedule"
- assertVisible:
    text: "מערכת שעות|Weekly Schedule"

# Verify Exams floating Add Exam button
- tapOn:
    id: "dock-tab-exams"
- assertVisible:
    text: "מבחנים|Exams"
- assertVisible:
    id: "add-exam-fab"

# Navigate to Admin and verify full-screen modal opens with inputs and action buttons
- tapOn:
    id: "dock-tab-admin"
- assertVisible:
    id: "add-user-fab"
- tapOn:
    id: "add-user-fab"
- assertVisible:
    id: "create-username"
- assertVisible:
    id: "create-user-submit"
- assertVisible:
    id: "create-user-cancel"
- tapOn:
    id: "create-user-cancel"

# Log out
- tapOn:
    id: "header-account-button"
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
- tapOn:
    id: "logout-button"

# 2. Child user views schedule in read-only mode without child selector or edit FAB
- tapOn:
    id: "server-url-input"
- eraseText: 100
- inputText: "${SERVER_URL}"
- tapOn:
    id: "username-input"
- inputText: "${CHILD_USERNAME}"
- tapOn:
    id: "password-input"
- inputText: "${CHILD_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "login-submit-button"

- tapOn:
    id: "dock-tab-schedule"
- assertNotVisible:
    id: "schedule-child-selector"
- assertNotVisible:
    id: "schedule-edit-fab"
