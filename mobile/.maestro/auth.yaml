appId: com.school.app
---
# 1. Displays login form with server URL, username, password and submit button
- launchApp:
    clearState: true
- assertVisible:
    id: "server-url-input"
- assertVisible:
    id: "username-input"
- assertVisible:
    id: "password-input"
- assertVisible:
    id: "login-submit-button"

# 2. Shows error notification on invalid credentials
- tapOn:
    id: "server-url-input"
- inputText: "${SERVER_URL}"
- tapOn:
    id: "username-input"
- inputText: "nonexistent_user_123"
- tapOn:
    id: "password-input"
- inputText: "wrong_password_123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "login-error-box"

# 3. Successfully logs in with dedicated test user and logs out
- tapOn:
    id: "username-input"
- eraseText: 50
- inputText: "${ADMIN_USERNAME}"
- tapOn:
    id: "password-input"
- eraseText: 50
- inputText: "${ADMIN_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "login-submit-button"

- assertVisible:
    id: "mobile-header-title"
- assertVisible:
    text: "שיעורי בית|Homework"

# Navigate to Account page via header avatar and log out
- tapOn:
    id: "header-account-button"
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
- tapOn:
    id: "logout-button"

# Should return to Login screen
- assertVisible:
    id: "username-input"
