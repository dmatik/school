appId: com.school.app
---
# 1. Admin user sees Homework, Incidents, Exams, Schedule, Settings, and Admin tabs
- launchApp:
    clearState: true
- tapOn:
    id: "server-url-input"
- inputText: "${SERVER_URL}"
- tapOn:
    id: "username-input"
- inputText: "${ADMIN_USERNAME}"
- tapOn:
    id: "password-input"
- inputText: "${ADMIN_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "login-submit-button"

- assertVisible:
    text: "שיעורי בית|Homework"

- tapOn:
    id: "dock-tab-incidents"
- assertVisible:
    text: "אירועי משמעת|School Incidents"

- tapOn:
    id: "dock-tab-exams"
- assertVisible:
    text: "מבחנים|Exams"

- tapOn:
    id: "dock-tab-schedule"
- assertVisible:
    text: "מערכת שעות|Weekly Schedule"

- tapOn:
    id: "dock-tab-settings"
- assertVisible:
    text: "הגדרות|Settings"
- assertVisible:
    text: "חיבור למערכת Webtop|Webtop Integration"

- tapOn:
    id: "dock-tab-admin"
- assertVisible:
    text: "ניהול מערכת|System Administration"
- assertVisible:
    id: "add-user-fab"

# Open Account via header avatar and verify Sign Out button
- tapOn:
    id: "header-account-button"
- assertVisible:
    text: "הגדרות חשבון|Account Settings"
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
- tapOn:
    id: "logout-button"
- assertVisible:
    id: "username-input"

# 2. Regular parent user sees 5 tabs and does NOT see Admin tab
- tapOn:
    id: "server-url-input"
- eraseText: 100
- inputText: "${SERVER_URL}"
- tapOn:
    id: "username-input"
- inputText: "${PARENT_USERNAME}"
- tapOn:
    id: "password-input"
- inputText: "${PARENT_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "login-submit-button"

- assertVisible:
    id: "dock-tab-homework"
- assertVisible:
    id: "dock-tab-settings"
- assertNotVisible:
    id: "dock-tab-admin"

- tapOn:
    id: "dock-tab-settings"
- assertVisible:
    text: "חיבור למערכת Webtop|Webtop Integration"

- tapOn:
    id: "header-account-button"
- scrollUntilVisible:
    element:
      id: "logout-button"
    direction: DOWN
- tapOn:
    id: "logout-button"

# 3. Child user sees Appearance & Language in Settings, NO Webtop config, NO Admin tab, and Sync button remains visible
- tapOn:
    id: "server-url-input"
- eraseText: 100
- inputText: "${SERVER_URL}"
- tapOn:
    id: "username-input"
- inputText: "${CHILD_USERNAME}"
- tapOn:
    id: "password-input"
- inputText: "${CHILD_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "login-submit-button"

- assertNotVisible:
    id: "dock-tab-admin"
- assertVisible:
    id: "header-sync-button"

- tapOn:
    id: "dock-tab-settings"
- assertVisible:
    id: "settings-language-selector"
- assertVisible:
    id: "settings-theme-selector"
- assertNotVisible:
    text: "חיבור למערכת Webtop|Webtop Integration"
