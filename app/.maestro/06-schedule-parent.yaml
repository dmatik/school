appId: com.dmatik.school
---
# Mirrors e2e/schedule.spec.ts: parent schedule, child selector, 3-day mobile table, share button, and edit FAB toggle
- runFlow: subflows/launch-clean.yaml

- runFlow:
    file: subflows/login.yaml
    env:
      USERNAME: "${ADMIN_USERNAME}"
      PASSWORD: "${ADMIN_PASSWORD}"

- tapOn:
    id: "dock-tab-schedule"
- assertVisible:
    text: "מערכת שעות|Weekly Schedule"

- assertVisible:
    id: "schedule-child-selector"
- assertVisible:
    id: "schedule-share-btn"
- assertVisible:
    id: "schedule-table"
- assertVisible:
    id: "schedule-hour-col"
- assertVisible:
    id: "schedule-finish-icon"
- assertVisible:
    text: ".*(סיום לימודים|Dismissal).*"

# Switch between synthetic children
- tapOn:
    text: "${CHILD2_NAME}"
- assertVisible:
    id: "schedule-table"
- tapOn:
    text: "${CHILD1_NAME}"

# Toggle edit mode header button on and off
- assertVisible:
    id: "schedule-edit-header-btn"
- tapOn:
    id: "schedule-edit-header-btn"
- assertVisible:
    id: "schedule-edit-header-btn"
- tapOn:
    id: "schedule-edit-header-btn"
- assertVisible:
    id: "schedule-edit-header-btn"
