appId: com.dmatik.school
---
- launchApp:
    clearState: true
    clearKeychain: true

# If running against an Expo Dev Client debug build, clearState resets the saved Metro URL.
# Connect back to local Metro automatically when the Dev Launcher screen appears.
- runFlow:
    when:
      visible: "Development servers|Enter URL manually|Fetch development servers"
    commands:
      - openLink: "school://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"

# Wait for LoginScreen (or Dev Menu onboarding if running --dev)
- extendedWaitUntil:
    visible:
      id: "server-url-input"
    timeout: 60000
- waitForAnimationToEnd

# Dismiss Expo Dev Client's first-launch onboarding sheet if running --dev
- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          notVisible: "This is the developer menu"
          timeout: 10000
      - waitForAnimationToEnd

# In --dev mode, Expo Dev Client's onboarding sheet can animate in right after the initial screen renders.
- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          notVisible: "This is the developer menu"
          timeout: 10000
      - waitForAnimationToEnd
